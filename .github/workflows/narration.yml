name: Fetch narration and time each word
on:
  push:
    paths: ["jobs/*.url"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Download narration files
        run: |
          mkdir -p audio
          for f in jobs/*.url; do
            n=$(basename "$f" .url)
            [ -f "audio/$n.mp3" ] || curl -fsSL "$(cat "$f")" -o "audio/$n.mp3"
          done
          ls -la audio
      - name: Word timings
        run: |
          pip install -q faster-whisper==1.0.3 requests
          python - <<'PY'
          import glob, json, os
          from faster_whisper import WhisperModel
          m = WhisperModel("small.en", device="cpu", compute_type="int8")
          for a in sorted(glob.glob("audio/*.mp3")):
              out = a[:-4] + ".words.json"
              if os.path.exists(out): continue
              segs, _ = m.transcribe(a, word_timestamps=True, beam_size=5, vad_filter=False)
              words = [{"w": w.word.strip(), "s": round(w.start, 3), "e": round(w.end, 3)} for s in segs for w in s.words]
              json.dump(words, open(out, "w"), indent=0)
              print(a, len(words), "words")
          PY
      - name: Save results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || git commit -m "Add narration audio and word timings"
          git push
